services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    networks:
      - network
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${DB_DATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - network
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - backend
      - frontend
    networks:
      - network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/var/www/html
    networks:
      - network
    depends_on:
      - db

  schedule:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schedule
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    networks:
      - network
    depends_on:
      - backend
      - redis
    restart: always

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queue-worker
    command: php artisan queue:work rabbitmq --queue=email
    volumes:
      - ./backend:/var/www/html
    networks:
      - network
    depends_on:
      - backend
      - redis
    restart: always

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: migrator
    command: sh -c "php artisan migrate && php artisan jwt:secret"
    volumes:
      - ./backend:/var/www/html
    networks:
      - network
    depends_on:
      - backend
      - redis
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - network

  websocket:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: websocket
    command: php artisan reverb:start --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/var/www/html
    networks:
      - network
    depends_on:
      - backend
      - redis
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - network

  rabbitmq:
    image: rabbitmq:management  # или rabbitmq:latest с переменными среды
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:
  pgadmin_data:
  redis_data:
  rabbitmq_data:

networks:
  network:
    driver: bridge