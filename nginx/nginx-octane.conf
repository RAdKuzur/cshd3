# Блок http - обязателен!
http {
    # Базовые настройки, которые были в оригинальном файле
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ВАШ БЛОК SERVER - вставлен внутрь http
    server {
        listen 80;
        server_name localhost;

        # Swagger / документация Laravel
        location ^~ /docs/ {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://localhost:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Статика Laravel storage
        location /storage/ {
            alias /var/www/html/storage/app/public/;
            try_files $uri $uri/ =404;

            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';

            location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
                expires max;
                add_header Cache-Control "public, immutable";
            }
        }

        # Backend API через Laravel Octane
        location ~ ^/api/(.*)$ {
            proxy_pass http://localhost:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        }

        # Favicon и robots
        location = /favicon.ico {
            alias /var/www/html/public/favicon.ico;
            expires max;
        }

        location = /robots.txt {
            alias /var/www/html/public/robots.txt;
            expires max;
        }
    }

    # Можете добавить другие server блоки если нужно
    include servers/*;
}

# События тоже должны быть вне http блока
events {
    worker_connections 1024;
}